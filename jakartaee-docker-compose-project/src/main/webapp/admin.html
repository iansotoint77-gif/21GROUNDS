<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21GROUNDS - Panel de Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="app-header"><h1>21GROUNDS</h1></header>

    <main class="app-main" id="main-content">
        <section class="view-section active" style="padding-top: 1.5rem; max-width: 1000px; margin: 0 auto; width: 100%;">

            <!-- Cabecera Admin -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; padding: 0 1rem;">
                <div>
                    <h2 style="font-size: 1.5rem; color: #001f3f; font-weight: 800; margin-bottom: 0.3rem;">Panel de Administración</h2>
                    <p style="color: #94a3b8; font-size: 0.85rem;">Gestiona usuarios y partidos de 21Grounds</p>
                </div>
                <a href="LogoutServlet" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; cursor: pointer;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    <span style="color: #ef4444; font-size: 0.7rem; font-weight: 800; margin-top: 0.2rem; text-transform: uppercase;">Salir</span>
                </a>
            </div>

            <!-- Tabs -->
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; padding: 0 1rem;">
                <button onclick="document.getElementById('tab-usuarios').style.display='block'; document.getElementById('tab-partidos').style.display='none'; this.style.backgroundColor='#001f3f'; this.style.color='white'; document.getElementById('btn-partidos').style.backgroundColor='white'; document.getElementById('btn-partidos').style.color='#001f3f';" id="btn-usuarios" style="flex: 1; background-color: #001f3f; color: white; padding: 0.8rem; border-radius: 8px; font-weight: 800; font-size: 0.9rem; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 0.5rem; text-transform: uppercase;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Usuarios
                </button>
                <button onclick="document.getElementById('tab-partidos').style.display='block'; document.getElementById('tab-usuarios').style.display='none'; this.style.backgroundColor='#001f3f'; this.style.color='white'; document.getElementById('btn-usuarios').style.backgroundColor='white'; document.getElementById('btn-usuarios').style.color='#001f3f';" id="btn-partidos" style="flex: 1; background-color: white; color: #001f3f; padding: 0.8rem; border-radius: 8px; font-weight: 800; font-size: 0.9rem; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 0.5rem; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M5.4 5.4c2.5 4.5 7.4 5 13.2 2.6"/><path d="M18.6 18.6c-2.5-4.5-7.4-5-13.2-2.6"/><path d="M12 2v20"/><path d="M2 12h20"/></svg>
                    Partidos
                </button>
            </div>

            <!-- Tarjeta principal -->
            <div class="card" style="background-color: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 300px; margin: 0 1rem;">

                <!-- Tab Usuarios -->
                <div id="tab-usuarios" style="display: block; overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 2px solid #f1f5f9; color: #64748b; font-size: 0.85rem; text-transform: uppercase;">
                                <th style="padding: 1rem 0.5rem;">Usuario</th>
                                <th style="padding: 1rem 0.5rem;">Nombre</th>
                                <th style="padding: 1rem 0.5rem;">Correo</th>
                                <th style="padding: 1rem 0.5rem; text-align: right;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <!-- JS inyectará los usuarios aquí -->
                        </tbody>
                    </table>
                </div>

                <!-- Tab Partidos -->
                <div id="tab-partidos" style="display: none; overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 2px solid #f1f5f9; color: #64748b; font-size: 0.85rem; text-transform: uppercase;">
                                <th style="padding: 1rem 0.5rem;">Pista</th>
                                <th style="padding: 1rem 0.5rem;">Tipo</th>
                                <th style="padding: 1rem 0.5rem;">Fecha</th>
                                <th style="padding: 1rem 0.5rem; text-align: right;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-partidos">
                            <!-- JS inyectará los partidos aquí -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>


    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarUsuarios();
            cargarPartidos();
        });

        async function cargarUsuarios() {
            try {
                const res = await fetch('AdminApiServlet?action=usuarios');
                if (!res.ok) {
                    if(res.status === 401) window.location.href = 'perfil.html';
                    return;
                }
                const usuarios = await res.json();
                const tbody = document.getElementById('tabla-usuarios');
                tbody.innerHTML = '';
                
                if (usuarios.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 2rem; color: #94a3b8;">No hay usuarios registrados.</td></tr>';
                    return;
                }

                usuarios.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid #f1f5f9';
                    tr.innerHTML = `
                        <td style="padding: 1rem 0.5rem; font-weight: bold; color: #001f3f;">${escapeHtml(u.username)}</td>
                        <td style="padding: 1rem 0.5rem; color: #475569;">${escapeHtml(u.nombre)} ${escapeHtml(u.apellido)}</td>
                        <td style="padding: 1rem 0.5rem; color: #475569;">${escapeHtml(u.correo)}</td>
                        <td style="padding: 1rem 0.5rem; text-align: right;">
                            <button onclick="eliminarEntidad('usuario', ${u.id})" style="background-color: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; text-transform: uppercase;">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Error cargando usuarios:', err);
            }
        }

        async function cargarPartidos() {
            try {
                const res = await fetch('AdminApiServlet?action=partidos');
                if (!res.ok) return;
                const partidos = await res.json();
                const tbody = document.getElementById('tabla-partidos');
                tbody.innerHTML = '';
                
                if (partidos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 2rem; color: #94a3b8;">No hay partidos creados.</td></tr>';
                    return;
                }

                partidos.forEach(p => {
                    // Formatear fecha
                    const fechaObj = new Date(p.fechaHora);
                    const fechaStr = isNaN(fechaObj) ? p.fechaHora : fechaObj.toLocaleString('es-ES', {
                        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid #f1f5f9';
                    tr.innerHTML = `
                        <td style="padding: 1rem 0.5rem; font-weight: bold; color: #001f3f;">${escapeHtml(p.lugar)}</td>
                        <td style="padding: 1rem 0.5rem; color: #475569;">${escapeHtml(p.tipoPartido)}</td>
                        <td style="padding: 1rem 0.5rem; color: #475569;">${fechaStr}</td>
                        <td style="padding: 1rem 0.5rem; text-align: right;">
                            <button onclick="eliminarEntidad('partido', ${p.id})" style="background-color: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; text-transform: uppercase;">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Error cargando partidos:', err);
            }
        }

        async function eliminarEntidad(tipo, id) {
            if (!confirm(`¿Estás seguro de que quieres eliminar este ${tipo}?`)) return;

            try {
                const res = await fetch(`AdminApiServlet?action=${tipo}&id=${id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                
                if (data.success) {
                    if (tipo === 'usuario') cargarUsuarios();
                    else cargarPartidos();
                } else {
                    alert('Error al eliminar: ' + (data.error || 'Desconocido'));
                }
            } catch (err) {
                console.error(`Error eliminando ${tipo}:`, err);
                alert('Error de conexión');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
