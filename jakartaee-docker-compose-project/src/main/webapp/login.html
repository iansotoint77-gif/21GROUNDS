<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21GROUNDS - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header class="app-header">
        <h1>21GROUNDS</h1>
    </header>

    <main class="app-main" id="main-content">
        <section class="view-section active">
            <div
                style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 180px);">
                <div
                    style="background-color: white; text-align: center; padding: 2.5rem 2.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 440px; width: 100%; margin: 0 auto;">
                    <h2 style="font-size: 1.3rem; color: #111; margin-bottom: 0.5rem; font-weight: 700;">Bienvenido a
                        21Grounds</h2>
                    <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 2.5rem;">Inicia sesión y unete a la
                        familia 21GROUNDS</p>

                    <div id="error-msg"
                        style="display: none; background-color: #fee2e2; color: #ef4444; padding: 0.8rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: bold;">
                        Credenciales incorrectas o usuario no existe.</div>
                    <script>
                        if (window.location.search.includes('error=true')) {
                            document.getElementById('error-msg').style.display = 'block';
                        }
                        if (window.location.search.includes('registrado=true')) {
                            const errorMsg = document.getElementById('error-msg');
                            errorMsg.style.display = 'block';
                            errorMsg.style.backgroundColor = '#dcfce3';
                            errorMsg.style.color = '#16a34a';
                            errorMsg.innerText = 'Cuenta creada con éxito. Inicia sesión.';
                        }
                    </script>

                    <form style="text-align: left;" id="login-form" action="LoginServlet" method="post">
                        <div style="margin-bottom: 1.5rem;">
                            <label
                                style="display: block; font-size: 0.75rem; color: #475569; font-weight: 700; margin-bottom: 0.6rem; text-transform: uppercase;">Correo
                                Electrónico o Usuario</label>
                            <div style="position: relative; display: flex; align-items: center;">
                                <div
                                    style="position: absolute; left: 14px; color: #94a3b8; display: flex; align-items: center;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <rect width="20" height="16" x="2" y="4" rx="2" />
                                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                                    </svg>
                                </div>
                                <input type="text" name="usuario" required
                                    style="width: 100%; padding: 0.8rem 1rem 0.8rem 2.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #333; outline: none;"
                                    placeholder="tuemail@ejemplo.com o @Myuser21">
                            </div>
                        </div>

                        <div style="margin-bottom: 0.5rem;">
                            <label
                                style="display: block; font-size: 0.75rem; color: #475569; font-weight: 700; margin-bottom: 0.6rem; text-transform: uppercase;">Contraseña</label>
                            <div style="position: relative; display: flex; align-items: center;">
                                <div
                                    style="position: absolute; left: 14px; color: #94a3b8; display: flex; align-items: center;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                    </svg>
                                </div>
                                <input type="password" name="password" required
                                    style="width: 100%; padding: 0.8rem 2.8rem 0.8rem 2.8rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #333; outline: none;"
                                    placeholder="••••••••">
                                <div style="position: absolute; right: 14px; color: #94a3b8; display: flex; align-items: center; cursor: pointer;"
                                    onclick="var i=this.previousElementSibling; i.type=i.type==='password'?'text':'password';">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <div style="text-align: right; margin-bottom: 2rem;">
                            <a href="#" style="color: #3b82f6; font-size: 0.8rem; text-decoration: none;">¿Olvidaste la
                                contraseña?</a>
                        </div>

                        <button type="submit" class="btn"
                            style="background-color: #001f3f; color: white; width: 100%; padding: 1rem; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; text-transform: uppercase;">ENTRAR</button>

                        <div style="text-align: center; margin-top: 2rem;">
                            <p style="color: #64748b; font-size: 0.85rem; margin: 0;">¿Aún no tienes cuenta? <a
                                    href="registro.html"
                                    style="color: #FF6B00; font-weight: bold; text-decoration: none;">Regístrate</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <nav class="app-footer">
        <a href="index.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg><span style="margin-top: 4px;">Inicio</span></a>
        <a href="partidos.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg><span style="margin-top: 4px;">Partidos</span></a>
        <a href="prestigio.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="6"></circle>
                <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path>
            </svg><span style="margin-top: 4px;">Prestigio</span></a>
        <a href="noticias.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2">
                </path>
                <path d="M18 14h-8"></path>
                <path d="M15 18h-5"></path>
                <path d="M10 6h8v4h-8V6Z"></path>
            </svg><span style="margin-top: 4px;">Noticias</span></a>
        <a href="perfil.html" class="nav-item active"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg"
                width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg><span style="margin-top: 4px;">Perfil</span></a>
    </nav>
    <script src="js/app.js"></script>
</body>

</html>
