<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21GROUNDS - Partidos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header class="app-header">
        <h1>21GROUNDS</h1>
    </header>

    <main class="app-main" id="main-content">
        <section class="view-section active">

            <div style="text-align: center; margin-top: 1rem; margin-bottom: 2rem;">
                <a href="crearPartido.html" class="btn btn-primary"
                    style="border-radius: 50px; font-weight: bold; padding: 0.8rem 2rem; font-size: 0.9rem; text-decoration: none; display: inline-block;">+
                    CREAR PARTIDO</a>
            </div>

            <h2 class="section-title" style="margin-bottom: 1rem;">Próximos retos</h2>

            <!-- Contenedor dinámico de partidos -->
            <div id="partidos-container">
                <!-- Estado de carga -->
                <div id="loading-state" style="text-align: center; padding: 3rem 1rem; color: #94a3b8;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        style="margin-bottom: 1rem; animation: spin 1s linear infinite; display: block; margin: 0 auto 1rem auto;">
                        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                    </svg>
                    <p style="font-size: 0.9rem;">Cargando partidos...</p>
                </div>

                <!-- Estado vacío (oculto por defecto) -->
                <div id="empty-state" style="display: none; text-align: center; padding: 3rem 1rem; color: #94a3b8;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        style="margin: 0 auto 1rem auto; display: block;">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M5.4 5.4c2.5 4.5 7.4 5 13.2 2.6" />
                        <path d="M18.6 18.6c-2.5-4.5-7.4-5-13.2-2.6" />
                        <path d="M12 2v20" />
                        <path d="M2 12h20" />
                    </svg>
                    <p style="font-size: 0.95rem; font-weight: bold; color: #64748b; margin-bottom: 0.5rem;">No hay
                        partidos disponibles</p>
                    <p style="font-size: 0.85rem;">¡Sé el primero en crear uno!</p>
                </div>

                <!-- Las tarjetas se inyectan aquí por JS -->
                <div id="lista-partidos"></div>
            </div>

        </section>
    </main>

    <nav class="app-footer">
        <a href="index.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg><span style="margin-top: 4px;">Inicio</span></a>
        <a href="partidos.html" class="nav-item active"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg"
                width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg><span style="margin-top: 4px;">Partidos</span></a>
        <a href="prestigio.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="6"></circle>
                <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path>
            </svg><span style="margin-top: 4px;">Prestigio</span></a>
        <a href="noticias.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2">
                </path>
                <path d="M18 14h-8"></path>
                <path d="M15 18h-5"></path>
                <path d="M10 6h8v4h-8V6Z"></path>
            </svg><span style="margin-top: 4px;">Noticias</span></a>
        <a href="perfil.html" class="nav-item"><svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg><span style="margin-top: 4px;">Perfil</span></a>
    </nav>

    <style>
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script src="js/app.js"></script>
    <script>
        // Cargar partidos desde la API al abrir la página
        document.addEventListener('DOMContentLoaded', () => {
            cargarPartidos();
        });

        async function cargarPartidos() {
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            const lista = document.getElementById('lista-partidos');

            try {
                const res = await fetch('PartidosApiServlet');
                if (!res.ok) throw new Error('Error ' + res.status);
                const partidos = await res.json();

                loading.style.display = 'none';

                if (partidos.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                lista.innerHTML = partidos.map(p => crearTarjetaPartido(p)).join('');

            } catch (err) {
                loading.innerHTML = '<p style="color:#ef4444;">Error al cargar partidos. Inténtalo de nuevo.</p>';
                console.error(err);
            }
        }

        function crearTarjetaPartido(p) {
            const jugActuales = p.jugadoresActuales ?? 0;
            const jugMax = p.maxJugadores ?? 2;
            const porEquipo = jugMax / 2;
            const eq1Lista = p.equipo1Jugadores || [];
            const eq2Lista = p.equipo2Jugadores || [];

            // Formatear fecha
            const fechaObj = new Date(p.fechaHora);
            const fechaStr = isNaN(fechaObj) ? p.fechaHora : fechaObj.toLocaleString('es-ES', {
                day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            // Construir avatares para un equipo
            // Construir avatares para un equipo
            // Cada entrada en jugadores tiene formato "id:username"
            const buildAvatars = (jugadores, totalSlots, alignRight) => {
                let html = '';
                for (let i = 0; i < totalSlots; i++) {
                    if (i < jugadores.length) {
                        const entry    = jugadores[i];          // Ej: "12:@TheGoat"
                        const sep      = entry.indexOf(':');
                        const userId   = parseInt(entry.substring(0, sep));
                        const username = entry.substring(sep + 1);
                        const inicial  = username.replace('@', '')[0]?.toUpperCase() ?? '?';
                        const color    = userId % 2 === 0 ? '#3B82F6' : '#FF6B00';
                        html += `<div class="player-avatar" style="background-color:${color};color:white;width:34px;height:34px;font-size:0.85rem;font-weight:bold;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;" title="${escapeHtml(username)}">${inicial}</div>`;
                    } else {
                        // Hueco vacío
                        html += `<div class="player-avatar" style="background-color:#E2E8F0;color:#94A3B8;width:34px;height:34px;font-size:0.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px dashed #CBD5E1;">?</div>`;
                    }
                }
                return html;
            };

            const avatarsEq1 = buildAvatars(eq1Lista, porEquipo, false);
            const avatarsEq2 = buildAvatars(eq2Lista, porEquipo, true);

            return `
            <div class="match-card-large" style="padding-bottom:0.5rem;margin-bottom:1.5rem;">
                <h3 style="font-size:1.1rem;margin-bottom:1rem;color:#111;">Partido en ${escapeHtml(p.lugar)}</h3>
                <div style="display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.5rem;">
                    <div style="display:flex;align-items:center;gap:0.5rem;color:#666;font-size:0.85rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        ${fechaStr}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;color:#666;font-size:0.85rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        ${escapeHtml(p.comunidadNombre)}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;color:#666;font-size:0.85rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                        ${jugActuales}/${jugMax} jugadores · ${escapeHtml(p.tipoPartido)}
                    </div>
                </div>
                <div class="match-vs-container" style="border-top:none;padding-top:0;margin-top:0;justify-content:space-between;margin-bottom:1.5rem;position:relative;">
                    <div>
                        <div style="font-size:0.75rem;color:#888;margin-bottom:0.5rem;">Equipo 1</div>
                        <div style="display:flex;gap:0.4rem;">${avatarsEq1}</div>
                    </div>
                    <div class="vs-badge" style="position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);font-size:0.85rem;padding:0.3rem 0.6rem;color:#111;font-weight:800;">vs</div>
                    <div>
                        <div style="font-size:0.75rem;color:#888;margin-bottom:0.5rem;text-align:right;">Equipo 2</div>
                        <div style="display:flex;gap:0.4rem;justify-content:flex-end;">${avatarsEq2}</div>
                    </div>
                </div>
                <button class="btn btn-primary btn-full" style="border-radius:8px;font-size:0.95rem;padding:0.7rem;margin-bottom:0.5rem;" onclick="unirsePartido(${p.id}, this)">Unirse</button>
            </div>`;
        }

        function unirsePartido(id, btn) {
            btn.disabled = true;
            btn.textContent = 'Uniéndose...';

            fetch('UnirseServlet?partidoId=' + id, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    const card = btn.closest('.match-card-large');
                    switch (data.resultado) {
                        case 'ok_equipo1':
                        case 'ok_equipo2': {
                            const equipo = data.resultado === 'ok_equipo1' ? '1' : '2';
                            btn.style.backgroundColor = '#16a34a';
                            btn.textContent = '✓ Unido al Equipo ' + equipo;
                            // Recargar las tarjetas para reflejar el nuevo jugador
                            setTimeout(() => cargarPartidos(), 1200);
                            break;
                        }
                        case 'ya_unido':
                            btn.style.backgroundColor = '#3b82f6';
                            btn.textContent = 'Ya estás en este partido';
                            btn.disabled = true;
                            break;
                        case 'lleno':
                            btn.style.backgroundColor = '#ef4444';
                            btn.textContent = 'Partido completo';
                            btn.disabled = true;
                            break;
                        case 'cerrado':
                            btn.style.backgroundColor = '#64748b';
                            btn.textContent = 'Partido cerrado';
                            btn.disabled = true;
                            break;
                        case 'no_sesion':
                            window.location.href = 'login.html';
                            break;
                        default:
                            btn.textContent = 'Error. Inténtalo de nuevo';
                            btn.disabled = false;
                    }
                })
                .catch(() => {
                    btn.textContent = 'Error de conexión';
                    btn.disabled = false;
                });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>

</html>
