<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21GROUNDS - Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="app-header">
        <h1>21GROUNDS</h1>
    </header>

    <main class="app-main" id="main-content">
        <section id="view-perfil" class="view-section active">

            <!-- Spinner mientras se comprueba la sesión -->
            <div id="loading-session" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 180px);">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </div>

            <!-- Vista para NO logueados (oculta hasta saber la sesión) -->
            <div id="vista-no-sesion" style="display: none; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 180px);">
                <div style="background-color: white; text-align: center; padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 420px; width: 100%; margin: 0 auto;">

                    <div style="width: 56px; height: 56px; background-color: #eff6ff; color: #3B82F6; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    </div>

                    <h2 style="font-size: 1.3rem; color: #111; margin-bottom: 0.8rem; font-weight: 700;">No has iniciado sesión</h2>
                    <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 2.5rem; line-height: 1.5;">Juega. Gana. Domina.</p>

                    <a href="login.html" style="background-color: #001f3f; color: white; width: 100%; padding: 0.9rem; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; text-transform: uppercase; text-decoration: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        INICIAR SESIÓN
                    </a>

                    <a href="registro.html" style="background-color: #FF6B00; color: white; width: 100%; padding: 0.9rem; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-transform: uppercase; text-decoration: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                        CREAR CUENTA
                    </a>
                </div>
            </div>

        </section>
    </main>

    <nav class="app-footer">
        <a href="index.html" class="nav-item">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span style="margin-top: 4px;">Inicio</span>
        </a>
        <a href="partidos.html" class="nav-item">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span style="margin-top: 4px;">Partidos</span>
        </a>
        <a href="prestigio.html" class="nav-item">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path></svg>
            <span style="margin-top: 4px;">Prestigio</span>
        </a>
        <a href="noticias.html" class="nav-item">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6Z"></path></svg>
            <span style="margin-top: 4px;">Noticias</span>
        </a>
        <a href="perfil.html" class="nav-item active">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span style="margin-top: 4px;">Perfil</span>
        </a>
    </nav>

    <style>
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>

    <script src="js/app.js"></script>
    <script>
        // Al cargar la página, consultar al servidor si hay sesión activa
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('SessionServlet');
                const datos = await res.json();

                document.getElementById('loading-session').style.display = 'none';

                if (datos.loggedIn) {
                    // Si está logueado como admin, enviar al panel de admin
                    if (datos.rol === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        // Usuario normal → ir a la vista de perfil-usuario
                        window.location.href = 'perfil-usuario.html';
                    }
                } else {
                    // No logueado → mostrar la vista de selección (login/registro)
                    document.getElementById('vista-no-sesion').style.display = 'flex';
                }
            } catch (err) {
                // Si falla la petición (ej: abriendo el HTML local sin servidor),
                // mostrar la vista de no-sesión por defecto
                document.getElementById('loading-session').style.display = 'none';
                document.getElementById('vista-no-sesion').style.display = 'flex';
                console.warn('No se pudo contactar con el servidor:', err);
            }
        });
    </script>
</body>
</html>
